name: Audit cask

on:
  push:
    # Branches only: the release action tags the commit *before* the cask
    # is regenerated, so an audit at the tag would always compare the old
    # cask with the new release and fail for no reason.
    branches: ['**']
  pull_request:

jobs:
  audit:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit the cask, once there is one
        # brew audit --online asks the GitHub API about the release; from a
        # shared runner address the anonymous limit is 60 an hour.
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f Casks/turtletask.rb ]; then echo "no cask yet"; exit 0; fi
          tap="$(brew --repository)/Library/Taps/reindance/homebrew-turtletask"
          mkdir -p "$(dirname "$tap")" && ln -s "$PWD" "$tap"
          brew style reindance/turtletask/turtletask
          brew audit --cask --online --strict reindance/turtletask/turtletask
